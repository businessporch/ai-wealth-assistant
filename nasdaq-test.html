<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纳斯达克连接测试</title><style>body{background:#061226;color:#eef5ff;font:16px system-ui;margin:20px auto;max-width:500px;padding:16px}article{background:#10213a;padding:16px;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}p{line-height:1.7}a{color:#86c6ff}</style><h1>纳斯达克连接测试</h1><p>仅测试一个指数，不是正式行情模块。页面打开且在前台时每60秒请求，共5次；失败不会显示模拟价格。无AI调用、无付费API。</p><p>来源：腾讯财经公开行情。原始行情时间按来源原样显示，时区和延迟尚未获官方确认，不能据此宣称交易所实时行情。</p><p id="state" role="status">正在测试…</p><div id="rows"></div><a href="./">返回财富助手</a><script>
let count=0,previous=null;
async function probe(){
const started=new Date();count++;
const card=document.createElement('article');document.querySelector('#rows').prepend(card);
try{
const response=await fetch('https://qt.gtimg.cn/q=usIXIC&_='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});
if(!response.ok)throw Error('HTTP '+response.status);
const raw=new TextDecoder('gb18030').decode(await response.arrayBuffer());
const match=raw.match(/="([^"]*)"/);if(!match)throw Error('返回格式无法识别');
const f=match[1].split('~');if(f[2]!=='.IXIC'||!Number.isFinite(Number(f[3]))||Number(f[3])<=0)throw Error('没有有效的纳斯达克数据');
const current={price:f[3],time:f[30]};
card.textContent='第'+count+'次：读取成功｜纳斯达克 '+current.price+'｜来源行情时间（原样）：'+current.time+'｜本次请求（北京时间）：'+started.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'｜'+(previous?(current.time!==previous.time?'行情时间已推进':'行情时间未变化'):'首次读取')+'。';
previous=current;
}catch(e){card.textContent='第'+count+'次：读取失败｜'+started.toISOString()+'｜'+e.message;}
document.querySelector('#state').textContent=count<5?'已完成 '+count+'/5 次，60秒后再次测试。':'5次测试已结束。成功读取不等于已确认数据授权、延迟或长期稳定性。';
if(count<5)setTimeout(probe,60000);
}probe();
</script></html>
